name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      VOLTA_FEATURE_PNPM: 1
    steps:
    - uses: actions/checkout@v6
    - name: Setup Volta and Node.js
      uses: volta-cli/action@v4
    - run: pnpm install
    - run: pnpm lint
    - run: pnpm lint:test
    - run: pnpm test
